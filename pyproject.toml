[project]
name = "factorVAE"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=3.10.1",
    "pandas>=2.3.3",
    "tqdm>=4.67.3",
    "torch",
    "pyyaml>=6.0.3",
    "colorlog>=6.7.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true  

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
factorVAE = "scripts.main:main"
