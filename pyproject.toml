[project]
name = "factor-vae"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.11.0",
    "mlflow>=3.10.1",
    "pandas>=2.3.3",
    "tqdm>=4.67.3",
    "torch",
    "pyyaml>=6.0.3",
    "colorlog>=6.7.0",
    "pyqlib>=0.9.7",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true  

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[project.scripts]
factor-vae-makedata = "scripts.make_data:main"
factor-vae-train = "scripts.main:main"
factor-vae-eval = "scripts.run_evaluation:main"

[project.optional-dependencies]
viz = [
    "graphviz>=0.20",
    "jupyter>=1.1.0",
    "matplotlib>=3.8.0",
    "notebook>=7.0.0",
    "torchinfo>=1.8.0",
    "torchview>=0.2.6",
]
