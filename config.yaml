log_level: "INFO"

# config.yaml
training:
  num_epochs: 25
  lr: 0.0002
  val_interval: 1
  seed: 42
  run_name: "Run4_H384_D2_Plateau"
  save_dir: "./best_models"
  device: null
  kl_annealing: true
  optimizer:
    name: adamw
    weight_decay: 0.0001
  scheduler:
    name: reduce_on_plateau
    monitor: val_loss
    patience: 3
    factor: 0.5

model:
  num_latent: 158
  num_portfolio: 128
  num_factor: 128
  hidden_size: 384
  dropout: 0.2
  gru_layers: 2

data:
  dataset: "CN"
  seq_len: 20
  num_workers: 2
  fit_start_time: "2009-01-01"
  fit_end_time: "2017-12-31"
  val_start_time: "2018-01-01"
  val_end_time: "2018-12-31"
  test_start_time: "2019-01-01"
  test_end_time: "2020-12-31"
  select_feature: null

mlflow:
  experiment: "FactorVAE"
  tracking_uri: "sqlite:///model_tracking/mlflow.db"


test:
  model_dir: "./best_models"
  model_name: "Overnight_HighCapacity_factor_128_hdn_256_port_128_seed_42.pt" 

# Optional: Add overrides for different environments (e.g., dev/prod)
